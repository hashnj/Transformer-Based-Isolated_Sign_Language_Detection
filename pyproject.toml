[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isolated-sign-recognition"
version = "0.1.0"
description = "Transformer-based isolated sign language recognition project"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fiftyone>=1.0,<2.0",
    "huggingface_hub>=1.1.3",
    "mediapipe==0.10.21",
    "numpy>=1.26,<2.0",
    "opencv-contrib-python==4.11.0.86",
]

[project.scripts]
download-wlasl-hf = "sign_language.data.download:main"
extract-wlasl-landmarks = "sign_language.data.landmarks:main"
check-wlasl-landmarks = "sign_language.data.check_landmarks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
